# NERO single-arm TEMPLATE-NUDGE, tactile-augmented ("V2 + tactile" on LingBot base).
# LeRobot v3.0 dataset keys: observation.state[72], action[8],
# observation.images.image, observation.images.wrist_image.
#
# The 72-dim state = the pi0.5 "tac4" state = [ libero-8 | 64 four-finger taxels ].
#   [0:6]  = ee_pos(3) + axis_angle(3)   -> end.position
#   [6:8]  = gripper_2d                   -> effector.position
#   [8:72] = 64 taxels (Index/Middle/Ring/Pinky), PRE-SCALED to [-1,1] by the
#            pi0.5 converter -> tactile.position (a NEW 64-wide canonical slot).
# Action stays the 8-dim EE-delta (NO tactile in the action — tactile is an INPUT):
#   action[0:6] -> end.position, action[6:8] -> effector.position.
# The tactile slot widens the canonical state 55->94; state_proj/action projections
# are zero-padded from the pretrained 55 at load (LINGBOT_PAD_PROJ=1).
states:
  - observation.state.end.position:
      origin_keys:
        - observation.state:
            start: 0
            end: 6
  - observation.state.effector.position:
      origin_keys:
        - observation.state:
            start: 6
            end: 8
  - observation.state.tactile.position:
      origin_keys:
        - observation.state:
            start: 8
            end: 72

actions:
  - action.end.position:
      origin_keys:
        - action:
            start: 0
            end: 6
      subtract_state: false
  - action.effector.position:
      origin_keys:
        - action:
            start: 6
            end: 8
      subtract_state: false

images:
  - observation.images.camera_top:
      origin_keys: observation.images.image
  - observation.images.camera_wrist_left:
      origin_keys: observation.images.wrist_image

norm_stats: assets/norm_stats/nudge_template_tac4.json
